[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cohort"
version = "0.12.0"
description = "A portable, multi-IDE agentic office harness — canonical artifacts compiled per IDE."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # Pin typer with an explicit click so a fresh-machine resolve is deterministic
    # (some slim envs ship a typer without click); see Phase 9 CI.
    "typer>=0.12,<1.0",
    "click>=8.1,<9.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
# jsonschema is a dev-only dependency: cli/schema.py uses its own validator
# by design (stable error codes), but tests/test_schema_files.py uses
# jsonschema.Draft202012Validator to check the JSON Schema files themselves
# are well-formed. Not a runtime dependency of the `cohort` CLI.
dev = ["pytest>=8.0,<10.0", "jsonschema>=4.20,<5.0"]

[project.scripts]
cohort = "cohort.cli:run"

[tool.setuptools.packages.find]
where = ["cli"]

[tool.setuptools.package-data]
cohort = ["dashboard.html", "dashboard.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
